server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip            on;
  gzip_types      text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  # Service-worker control files — never cache; must revalidate so updates propagate.
  location = /ngsw.json            { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /ngsw-worker.js       { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /safety-worker.js     { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /ngsw-config.json     { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # index.html must not be cached — the hashed chunks it references change.
  location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }

  # Content-hashed bundles — safe to cache forever. Regex is quoted so nginx doesn't
  # confuse the `{8,}` quantifier with its config-block delimiters.
  location ~* "-[A-Z0-9]{8,}\.(js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback — any unknown path resolves to index.html for the Angular router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
